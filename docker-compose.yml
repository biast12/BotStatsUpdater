services:
  bot-stats-updater:
    image: ${BOT_STATS_UPDATER_IMAGE:-ghcr.io/biast12/botstatsupdater:latest}
    container_name: bot-stats-updater
    restart: unless-stopped
    volumes:
      # Long form: on Linux a missing config.json fails instead of becoming a folder.
      - type: bind
        source: ./config.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
    # Stats API; the 127.0.0.1: prefix is what keeps it off the network.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # The app stamps /app/heartbeat with the deadline the next cycle must beat.
      test: ["CMD", "python", "-c", "import sys,time; sys.exit(0 if time.time() < float(open('/app/heartbeat').read()) else 1)"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 5m
